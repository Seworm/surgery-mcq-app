<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Surgery MCQs</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --accent: #007aff;
      --correct-bg: #d4edda;
      --correct-border: #28a745;
      --incorrect-bg: #f8d7da;
      --incorrect-border: #dc3545;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5ea;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-container {
      flex: 1;
      margin-right: 12px;
    }
    .progress-bar {
      height: 6px;
      background: #e5e5ea;
      width: 100%;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }
    .top-nav {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }
    .nav-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:disabled {
      background: #c7c7cc;
      cursor: not-allowed;
    }
    .grid-btn {
      background: #e5e5ea;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    main {
      flex: 1;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .question-card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .question-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .option-btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1.5px solid #e5e5ea;
      border-radius: 10px;
      background: #fafafa;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      box-sizing: border-box;
      color: var(--text);
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: #155724;
      font-weight: bold;
    }
    .option-btn.incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect-border);
      color: #721c24;
    }
    .explanation-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
      display: none;
      background: #f8f9fa;
      border: 1px solid #cbd5e1;
    }
    .explanation-box.show {
      display: block;
    }
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 14px;
      width: 90%;
      max-width: 450px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid #e5e5ea;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .q-grid-item {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .q-grid-item.correct { background: var(--correct-border); color: white; border: none; }
    .q-grid-item.incorrect { background: var(--incorrect-border); color: white; border: none; }
    .q-grid-item.current { border: 2px solid var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="progress-container">
        <div id="q-number" style="font-size: 12px; color: #8e8e93; font-weight: bold;">Question 1 of 90</div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      </div>
      <div id="score-display" style="font-weight: bold; color: var(--accent); font-size: 15px;">Score: 0 / 90</div>
    </div>
    
    <!-- Navigation relocated to TOP for instant access -->
    <div class="top-nav">
      <button class="nav-btn" id="prev-btn" onclick="prevQuestion()" disabled>← Prev</button>
      <button class="grid-btn" onclick="toggleModal()">☰ Grid</button>
      <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Next →</button>
    </div>
  </header>

  <main>
    <div class="question-card">
      <div class="question-title" id="q-text">Loading question...</div>
      <div id="options-container"></div>
      <div class="explanation-box" id="explanation"></div>
    </div>
  </main>

  <!-- Question Grid Modal -->
  <div class="modal" id="grid-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Question Navigator</span>
        <button class="grid-btn" onclick="toggleModal()">✕ Close</button>
      </div>
      <div class="modal-body" id="grid-container"></div>
    </div>
  </div>

  <script>

      {

      {

    let currentIndex = 0;
    let score = 0;
    let answered = {};

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('q-number').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('progress').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      document.getElementById('q-text').innerText = q.text;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;

        if (answered[currentIndex] !== undefined) {
          btn.disabled = true;
          if (idx === q.correct) btn.classList.add('correct');
          if (idx === answered[currentIndex] && idx !== q.correct) btn.classList.add('incorrect');
        } else {
          btn.onclick = () => selectOption(idx);
        }
        container.appendChild(btn);
      });

      const expBox = document.getElementById('explanation');
      if (answered[currentIndex] !== undefined) {
        expBox.innerHTML = `<strong>Explanation & Rationale:</strong><br>${q.explanation}`;
        expBox.classList.add('show');
      } else {
        expBox.classList.remove('show');
      }

      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;
      
      // Scroll smoothly back to top when switching questions
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectOption(index) {
      const q = questions[currentIndex];
      answered[currentIndex] = index;
      if (index === q.correct) score++;
      document.getElementById('score-display').innerText = `Score: ${score} / ${questions.length}`;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function toggleModal() {
      const modal = document.getElementById('grid-modal');
      modal.classList.toggle('show');
      if (modal.classList.contains('show')) {
        renderGrid();
      }
    }

    function renderGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';
      questions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'q-grid-item';
        item.innerText = idx + 1;
        if (idx === currentIndex) item.classList.add('current');
        if (answered[idx] !== undefined) {
          if (answered[idx] === q.correct) item.classList.add('correct');
          else item.classList.add('incorrect');
        }
        item.onclick = () => {
          currentIndex = idx;
          renderQuestion();
          toggleModal();
        };
        container.appendChild(item);
      });
    }

    renderQuestion();
