<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Surgery MCQs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text-main: #1c1c1e;
      --text-sub: #8e8e93;
      --accent: #007aff;
      --correct-bg: #e6f4ea;
      --correct-border: #34a853;
      --correct-text: #137333;
      --incorrect-bg: #fce8e6;
      --incorrect-border: #ea4335;
      --incorrect-text: #c5221f;
      --border-color: #e5e5ea;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .progress-container {
      flex: 1;
      margin-right: 16px;
    }

    .q-counter {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-bar {
      height: 6px;
      background: #e5e5ea;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .grid-toggle-btn {
      background: #f0f0f5;
      border: none;
      color: var(--accent);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }

    .question-title {
      font-weight: 600;
      font-size: 17px;
      line-height: 1.45;
      margin-bottom: 18px;
      color: var(--text-main);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      background: #fdfdfd;
      text-align: left;
      font-size: 15px;
      line-height: 1.4;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect-border);
      color: var(--incorrect-text);
      font-weight: 600;
    }

    .option-status-icon {
      font-size: 18px;
      margin-left: 10px;
    }

    .explanation-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .explanation-box.correct {
      background-color: var(--correct-bg);
      border: 1px solid var(--correct-border);
    }

    .explanation-box.incorrect {
      background-color: var(--incorrect-bg);
      border: 1px solid var(--incorrect-border);
    }

    .explanation-box.show {
      display: block;
    }

    .exp-header {
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .exp-header.correct { color: var(--correct-text); }
    .exp-header.incorrect { color: var(--incorrect-text); }

    footer {
      background: var(--card-bg);
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav-btn.secondary {
      background: #e5e5ea;
      color: var(--accent);
    }

    .nav-btn.primary {
      background: var(--accent);
      color: white;
    }

    .nav-btn:disabled {
      background: #f2f2f7;
      color: #c7c7cc;
      cursor: not-allowed;
    }

    /* Modal Grid */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-height: 85vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    .score-summary-box {
      background: var(--bg);
      padding: 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .grid-item {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
    }

    .grid-item.current {
      border: 2px solid var(--accent);
    }

    .grid-item.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .grid-item.incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect-border);
      color: var(--incorrect-text);
    }
  </style>
</head>
<body>

  <header>
    <div class="progress-container">
      <div class="q-counter" id="q-counter">Question 1 of 90</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <button class="grid-toggle-btn" onclick="toggleModal(true)">
      <i class="fa-solid fa-border-all"></i>
    </button>
  </header>

  <main>
    <div class="card">
      <div class="question-title" id="q-text">Loading...</div>
      <div class="options-list" id="options-container"></div>
      <div class="explanation-box" id="explanation-box"></div>
    </div>
  </main>

  <footer>
    <button class="nav-btn secondary" id="prev-btn" onclick="prevQuestion()" disabled>
      <i class="fa-solid fa-chevron-left"></i> Previous
    </button>
    <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()">
      Next <i class="fa-solid fa-chevron-right"></i>
    </button>
  </footer>

  <!-- Question Navigator Modal -->
  <div class="modal-overlay" id="grid-modal" onclick="if(event.target===this) toggleModal(false)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Question Navigator</div>
        <button class="close-btn" onclick="toggleModal(false)">Done</button>
      </div>

      <div class="score-summary-box">
        <div>
          <div style="font-size: 12px; color: var(--text-sub); font-weight: bold;">OVERALL SCORE</div>
          <div id="modal-score" style="font-size: 22px; font-weight: 800; color: var(--accent);">0 / 90</div>
        </div>
        <div id="modal-percentage" style="font-size: 18px; font-weight: 700; color: var(--text-sub);">0%</div>
      </div>

      <div class="grid-container" id="grid-container"></div>
    </div>
  </div>

  <script>
    const surgeryQuestions = [
      {
        id: 1,
        text: "1. Which of the following radiological features is specific for a patient with ruptured diaphragm?",
        options: [
          "A. Loss of the splenic outline on coned views",
          "B. Loss of the psoas shadow",
          "C. Elevation of the left cupola of the diaphragm",
          "D. Collar sign",
          "E. Colon cutoff sign"
        ],
        correctAnswerIndex: 3,
        explanation: "Collar Sign (or 'hourglass sign') on CT scan or contrast radiograph is a characteristic sign of traumatic diaphragmatic rupture, caused by constriction of the herniated abdominal viscera as it passes through the focal diaphragmatic defect."
      },
      {
        id: 2,
        text: "2. A man of 35 years old was involved in an R.T.A. presented in the emergency room with severe upper abdominal pain and dyspnoea but without haematuria. On examination he was anxious, not anaemic, with a pulse of 92/min and a BP of 115/70mmHg. His chest was clear, he was tender in the left hypochondrium. The bowel sounds were normal and rectal examination was unremarkable. The most likely clinical diagnosis is:",
        options: [
          "A. Ruptured right kidney",
          "B. Grade I splenic injury",
          "C. Small bowel perforation",
          "D. Haemothorax (left)",
          "E. Ruptured spleen"
        ],
        correctAnswerIndex: 4,
        explanation: "In blunt abdominal trauma following a road traffic accident (RTA), left hypochondrial tenderness associated with dyspnoea and left upper quadrant abdominal pain strongly points toward splenic injury/rupture."
      },
      {
        id: 3,
        text: "3. The following are differentials for achalasia EXCEPT",
        options: [
          "A. Oesophageal stricture or webs",
          "B. Gastro-Oesophageal Reflux Disease",
          "C. Plummer Vinson Syndrome",
          "D. Zenker's diverticulum",
          "E. Barrett's Oesophagus"
        ],
        correctAnswerIndex: 4,
        explanation: "Barrett's oesophagus is a premalignant metaplasia secondary to long-standing GORD. It presents as a complication of reflux rather than a differential diagnosis for motility disorders like achalasia."
      },
      {
        id: 4,
        text: "4. The following is TRUE about oesophageal cancer",
        options: [
          "A. Approximately 70% are treated palliatively",
          "B. Dysphagia is first to liquids",
          "C. Incidence is higher in women than men",
          "D. 'Bird-beak' appearance on barium swallow is diagnostic",
          "E. Adenocarcinoma is more common in developing countries"
        ],
        correctAnswerIndex: 0,
        explanation: "Most patients with oesophageal cancer present late with advanced stage disease; thus approximately 70% of patients are suitable only for palliative management."
      },
      {
        id: 5,
        text: "5. Clinical features of mechanical bowel obstruction include all the following EXCEPT:",
        options: [
          "A. Cramp-like central abdominal pain with profuse vomiting",
          "B. Absolute constipation",
          "C. Increasing tender abdominal distension",
          "D. Absent bowel sounds",
          "E. Visible peristalsis"
        ],
        correctAnswerIndex: 3,
        explanation: "In mechanical bowel obstruction, bowel sounds are classically hyperactive or high-pitched/tinkling. Absent bowel sounds signify paralytic (adynamic) ileus or peritonitis."
      },
      {
        id: 6,
        text: "6. Maydl strangulation:",
        options: [
          "A. Is the presence of two small loops of bowel in a single hernial sac",
          "B. Is more common in strangulated femoral hernia",
          "C. May not be associated with constipation",
          "D. May involve herniation of only a portion of the circumference of the bowel wall",
          "E. Usually not associated with vomiting"
        ],
        correctAnswerIndex: 0,
        explanation: "Maydl hernia (hernia-in-W) involves two adjacent loops of small intestine within the hernial sac, while the intermediate central loop remains inside the abdominal cavity and is the primary site of ischemia."
      },
      {
        id: 7,
        text: "7. In Cancer of the breast",
        options: [
          "A. The most frequently affected site is the upper inner quadrant",
          "B. The commonest presenting complaint is itchiness of the nipple",
          "C. Cervical lymph node involvement is N3",
          "D. Radiotherapy is indicated in those with lymphovascular infiltration",
          "E. Peau d'orange is due to invasion of the ligaments of cooper in the breast"
        ],
        correctAnswerIndex: 2,
        explanation: "In the TNM staging system for breast cancer, metastasized involvement of ipsilateral supraclavicular or cervical lymph nodes is categorized as N3 disease."
      },
      {
        id: 8,
        text: "8. Regarding carcinoma of the breast",
        options: [
          "A. Prolong use of hormone replacement therapy reduces the risk of breast cancer",
          "B. Certain gene inheritance is involved in 45% of breast cancer",
          "C. A personal history of mastitis is a risk factor",
          "D. BRCA2 is located on chromosome 17 and 13",
          "E. Early menopause is an associated factor"
        ],
        correctAnswerIndex: 3,
        explanation: "BRCA1 is located on chromosome 17q21, and BRCA2 is located on chromosome 13q12."
      },
      {
        id: 9,
        text: "9. Recognised complication of mastectomy includes:",
        options: [
          "A. Erbs palsy",
          "B. Klumkpe's palsy",
          "C. Phantom Breast Pain Syndrome (PBS)",
          "D. Winging of the scapula from thoracodorsal nerve injury",
          "E. Lung fibrosis"
        ],
        correctAnswerIndex: 2,
        explanation: "Phantom breast pain syndrome (PBS) and post-mastectomy pain syndrome are well-recognised neurological complications."
      },
      {
        id: 10,
        text: "10. The most appropriate biopsy for suspected Inflammatory Breast Cancer is",
        options: [
          "A. Core biopsy",
          "B. Incision biopsy",
          "C. Excision Biopsy",
          "D. Wide Local Excision",
          "E. Fine Needle Aspiration Cytology"
        ],
        correctAnswerIndex: 0,
        explanation: "Core needle biopsy (including skin punch biopsy for dermal lymphatic invasion) is the standard diagnostic modality for confirming inflammatory breast carcinoma."
      },
      {
        id: 11,
        text: "11. Contraindication to breast conservation include",
        options: [
          "A. Age more than 60",
          "B. Multicentric lesions on mammogram",
          "C. Grade I cancer",
          "D. Multifocal lesions on mammogram",
          "E. Jehovah's Witness"
        ],
        correctAnswerIndex: 1,
        explanation: "Multicentric disease (tumors in two or more different quadrants of the breast) is an absolute contraindication to breast-conserving surgery (BCS)."
      },
      {
        id: 12,
        text: "12. In bronchogenic carcinoma, the squamous cell carcinoma",
        options: [
          "A. is the most malignant form of lung cancer",
          "B. may produce hormonal effects",
          "C. metastasizes early, sometimes before the primary is evident radiographically",
          "D. is common in young females and nonsmokers",
          "E. is frequently central in location"
        ],
        correctAnswerIndex: 4,
        explanation: "Squamous cell carcinomas typically arise centrally in the major bronchi and undergo central necrosis and cavitation."
      },
      {
        id: 13,
        text: "13. The following are bronchopulmonary symptoms EXCEPT",
        options: [
          "A. Paraneoplastic symptoms",
          "B. Failure of a febrile chest illness to resolve",
          "C. Haemoptysis",
          "D. Dyspnoea",
          "E. Chest pain"
        ],
        correctAnswerIndex: 0,
        explanation: "Paraneoplastic symptoms are systemic manifestations caused by ectopic hormone release rather than primary bronchopulmonary anatomical involvement."
      },
      {
        id: 14,
        text: "14. Which of the following is true about barium swallow and meal in the investigation of dysphagia?",
        options: [
          "A. Should always follow oesophagoscopy",
          "B. Showing a dilated oesophagus with a smooth narrowing of the lower end tapering off at the cardia is typical of achalasia",
          "C. Showing a regular smooth narrowing of varying length is suggestive of carcinoma",
          "D. Showing an irregular filling defect is typical of stricture",
          "E. Showing shouldering above a narrowed part of the oesophagus is typical of leiomyoma."
        ],
        correctAnswerIndex: 1,
        explanation: "A bird's beak smooth tapering appearance of the lower oesophageal sphincter with proximal dilation is classic for achalasia on barium swallow."
      },
      {
        id: 15,
        text: "15. Which of the following is the earliest symptom of carcinoma of the esophagus?",
        options: [
          "A. Dysphagia starting with solids",
          "B. Loss of appetite",
          "C. Regurgitation of food",
          "D. Retrosternal pain",
          "E. Vomiting"
        ],
        correctAnswerIndex: 0,
        explanation: "Progressive dysphagia, initially to solid food and eventually progressing to liquids, is the earliest and most common presenting symptom."
      },
      {
        id: 16,
        text: "16. Which of the following is the MOST common location of malignant gastric ulcer?",
        options: [
          "A. Body",
          "B. Cardias",
          "C. Lesser curvature",
          "D. Pre-pyloric region",
          "E. Pylorus"
        ],
        correctAnswerIndex: 2,
        explanation: "The lesser curvature (specifically the antrum and incisura angularis) is the most common site for gastric ulcerations, including gastric adenocarcinoma."
      },
      {
        id: 17,
        text: "17. All of the following are complications of the pre-pyloric ulcer EXCEPT:",
        options: [
          "A. bleeding",
          "B. gastric outlet obstruction",
          "C. hour-glass stomach",
          "D. malignancy",
          "E. perforation"
        ],
        correctAnswerIndex: 2,
        explanation: "Hour-glass stomach is a complication of saddle-shaped gastric ulcers located on the mid-lesser curvature of the body of the stomach, not pre-pyloric ulcers."
      },
      {
        id: 18,
        text: "18. Which of the following is an effect of gastric outlet obstruction?",
        options: [
          "A. Hyperpotassemia",
          "B. Hypochloremia alkalosis",
          "C. Hyponatremia",
          "D. Microcytic anemia",
          "E. Renal failure"
        ],
        correctAnswerIndex: 1,
        explanation: "Persistent vomiting of HCl-rich gastric secretions leads to hypochloremic, hypokalemic metabolic alkalosis with paradoxical aciduria."
      },
      {
        id: 19,
        text: "19. Which of the following statements is correct about peptic ulcer perforation?",
        options: [
          "A. Chest X-ray in the erect position reveals gas under the diaphragm in 98% of patients",
          "B. Gas and alkaline contents escape into the peritoneal cavity",
          "C. The initial severe abdominal pain may improve after 6-12 hrs.",
          "D. The temperature is initially elevated but the pulse rate is normal",
          "E. There is immediate chemical and bacterial peritonitis"
        ],
        correctAnswerIndex: 2,
        explanation: "During the stage of illusion/reaction (6–12 hours after perforation), abdominal pain may temporarily improve due to dilution of acidic gastric juice by peritoneal exudate."
      },
      {
        id: 20,
        text: "20. Gastric carcinoma presents MOST commonly as:",
        options: [
          "A. bleeding",
          "B. dyspepsia",
          "C. gastric outlet obstruction",
          "D. lump",
          "E. metastasis"
        ],
        correctAnswerIndex: 1,
        explanation: "Vague dyspepsia, epigastric discomfort, and early satiety are the earliest and most common presenting symptoms of gastric carcinoma."
      },
      {
        id: 21,
        text: "21. Which of the following is a true statement?",
        options: [
          "A. 85% of chest injuries are caused by road traffic accidents",
          "B. 15% of chest injuries can be managed conservatively",
          "C. Pedestrians are the most affected in road traffic accidents",
          "D. Chest injuries account for 90% of all trauma deaths",
          "E. Young women are the most affected in road traffic accidents"
        ],
        correctAnswerIndex: 0,
        explanation: "In major trauma registries, RTAs account for approximately 80–85% of blunt chest injuries."
      },
      {
        id: 22,
        text: "22. Concerning the period of 'Early death' in chest injury",
        options: [
          "A. It occurs within 3-13 hours",
          "B. The deaths are due to missed injuries",
          "C. Is the golden hour during which many people can be saved",
          "D. The deaths are due to disruption of the heart or great vessels",
          "E. The victims die within days to weeks"
        ],
        correctAnswerIndex: 2,
        explanation: "In trauma trimodal death distribution, 'early death' occurs within minutes to hours ('the golden hour') during which rapid assessment and ATLS resuscitation save lives."
      },
      {
        id: 23,
        text: "23. Which of the following is true concerning the lethal six?",
        options: [
          "A. Airway obstruction is not included",
          "B. In tension pneumothorax you quickly insert a wide bore cannula in the 2nd intercostal space, mid-clavicular line",
          "C. In tension pneumothorax you quickly insert a wide bore cannula in the 5th intercostal space, mid-axillary line",
          "D. It includes lung contusion",
          "E. It does not include flail chest"
        ],
        correctAnswerIndex: 2,
        explanation: "Updated ATLS guidelines recommend needle decompression of tension pneumothorax using a long cannula in the 5th intercostal space, anterior/mid-axillary line in adults."
      },
      {
        id: 24,
        text: "24. The common symptoms in carcinoma of the large bowel include all the following except:",
        options: [
          "A. Change bowel in habits and abdominal pain",
          "B. Constipation",
          "C. Diarrhoea",
          "D. Alternating constipation and diarrhoea",
          "E. Abdominal pain, distension and passage of blood or mucus in the faeces"
        ],
        correctAnswerIndex: 1,
        explanation: "Isolated simple constipation alone without altering bowel habits or associated rectal bleeding is rarely a primary symptom of colorectal cancer."
      },
      {
        id: 25,
        text: "25. Carcinoma of the caecum or ascending colon commonly presents with:",
        options: [
          "A. Constipation",
          "B. Pyrexia of Unknown origin",
          "C. Anaemia",
          "D. Abdominal distension",
          "E. Alternating constipation and diarrhoea"
        ],
        correctAnswerIndex: 2,
        explanation: "Right-sided (caecal/ascending) colon cancers bleed occultly, classicially presenting with unexplained iron deficiency anaemia and fatigue."
      },
      {
        id: 26,
        text: "26. Which of the following is TRUE?",
        options: [
          "A. A heart block is a condition in which the electrical impulses are conducted faster through the conduction pathway",
          "B. In complete heart block, each p-wave is followed by a QRS complex",
          "C. A patient whose heart rate is 35 beats per minute is likely being controlled by the ventricles",
          "D. A pacemaker is an artificial device that controls the cardiac rhythm by electrical impulses",
          "E. A patient whose heart rate is 68 beats per minute is likely being controlled by the AV node"
        ],
        correctAnswerIndex: 3,
        explanation: "A cardiac pacemaker is an electronic medical device that delivers electrical impulses to regulate heart rate and rhythm."
      },
      {
        id: 27,
        text: "27. Which of the following is TRUE concerning corrosive ingestion",
        options: [
          "A. In adults it is often due to parental neglect",
          "B. In adults it is often accidental",
          "C. In adults it is often suicidal",
          "D. In adults it often occurs in homes where local soap is manufactured",
          "E. In adults it often occurs in those with a high socio-economic status"
        ],
        correctAnswerIndex: 2,
        explanation: "In adults, corrosive ingestion is predominantly deliberate/suicidal in intent, whereas in children it is almost exclusively accidental."
      },
      {
        id: 28,

    let currentIndex = 0;
    let selectedAnswers = {}; // questionIndex: selectedOptionIndex

    function updateUI() {
      const q = surgeryQuestions[currentIndex];
      document.getElementById('q-counter').innerText = `Question ${currentIndex + 1} of ${surgeryQuestions.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / surgeryQuestions.length) * 100}%`;
      document.getElementById('q-text').innerText = q.text;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      const isAnswered = selectedAnswers[currentIndex] !== undefined;
      const userSelect = selectedAnswers[currentIndex];

      q.options.forEach((optionText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        let iconHTML = '';
        if (isAnswered) {
          btn.disabled = true;
          if (idx === q.correctAnswerIndex) {
            btn.classList.add('correct');
            iconHTML = '<i class="fa-solid fa-circle-check option-status-icon"></i>';
          } else if (idx === userSelect) {
            btn.classList.add('incorrect');
            iconHTML = '<i class="fa-solid fa-circle-xmark option-status-icon"></i>';
          }
        } else {
          btn.onclick = () => selectOption(idx);
        }

        btn.innerHTML = `<span>${optionText}</span>${iconHTML}`;
        optionsContainer.appendChild(btn);
      });

      const expBox = document.getElementById('explanation-box');
      if (isAnswered) {
        const isCorrect = userSelect === q.correctAnswerIndex;
        expBox.className = `explanation-box show ${isCorrect ? 'correct' : 'incorrect'}`;
        expBox.innerHTML = `
          <div class="exp-header ${isCorrect ? 'correct' : 'incorrect'}">
            <i class="fa-solid ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'}"></i>
            ${isCorrect ? 'Correct Answer' : 'Incorrect'}
          </div>
          <div style="font-weight: bold; margin-bottom: 4px; color: var(--text-sub);">SURGICAL CONTEXT & EXPLANATION:</div>
          <div>${q.explanation}</div>
        `;
      } else {
        expBox.className = 'explanation-box';
      }

      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === surgeryQuestions.length - 1;
    }

    function selectOption(optionIndex) {
      if (selectedAnswers[currentIndex] === undefined) {
        selectedAnswers[currentIndex] = optionIndex;
        updateUI();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        updateUI();
      }
    }

    function nextQuestion() {
      if (currentIndex < surgeryQuestions.length - 1) {
        currentIndex++;
        updateUI();
      }
    }

    function calculateScore() {
      let score = 0;
      Object.keys(selectedAnswers).forEach(idx => {
        if (selectedAnswers[idx] === surgeryQuestions[idx].correctAnswerIndex) {
          score++;
        }
      });
      return score;
    }

    function toggleModal(show) {
      const modal = document.getElementById('grid-modal');
      if (show) {
        const score = calculateScore();
        document.getElementById('modal-score').innerText = `${score} / ${surgeryQuestions.length}`;
        const pct = Math.round((score / surgeryQuestions.length) * 100);
        document.getElementById('modal-percentage').innerText = `${pct}% Accuracy`;

        const gridContainer = document.getElementById('grid-container');
        gridContainer.innerHTML = '';

        surgeryQuestions.forEach((_, idx) => {
          const item = document.createElement('div');
          item.className = 'grid-item';
          if (idx === currentIndex) item.classList.add('current');

          if (selectedAnswers[idx] !== undefined) {
            if (selectedAnswers[idx] === surgeryQuestions[idx].correctAnswerIndex) {
              item.classList.add('correct');
            } else {
              item.classList.add('incorrect');
            }
          }

          item.innerText = idx + 1;
          item.onclick = () => {
            currentIndex = idx;
            updateUI();
            toggleModal(false);
          };
          gridContainer.appendChild(item);
        });

        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    // Initialize
    updateUI();
  </script>
